# Workflow derived from https://github.com/posit-dev/setup-air/tree/main/examples

on:
  push:
    branches: 
      - main
    paths: 
    - '**/*.R'
  pull_request:
    paths: 
    - '**/*.R'

name: air.yaml

permissions: read-all

jobs:
  air:
    name: air
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: posit-dev/setup-air@v1

      - id: check
        run: air format . --check
      
      - id: format
        if: failure() && steps.check.outcome == 'failure'
        run: |
          air format . || true
          git diff -U0 | awk '
            /^\+\+\+ b\// {
              file = substr($0, 7)
            }
            /^@@ / {
              # Extract the "+start,count" token
              split($0, parts, " ")
              new_range = parts[3]
              sub(/^\+/, "", new_range)
              split(new_range, lines, ",")
              
              start = lines[1]
              count = (lines[2] == "" ? 1 : lines[2])
              
              if (count > 0) {
                end = start + count - 1
                printf "::warning file=%s,line=%d,endLine=%d,title=air format::Formatted lines %d-%d\n", file, start, end, start, end
              }
            }
          '
          exit 0
      
      - id: suggest
        if: failure() && steps.check.outcome == 'failure'
        uses: reviewdog/action-suggester@v1.27
        with:
          tool_name: air
          level: warning
          github_token: ${{ secrets.GITHUB_TOKEN }}
      